<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="480" height="300" role="img" aria-label="Animated pixel lobster Clawd waving claws">
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="55%" stop-color="#14163a"/>
      <stop offset="100%" stop-color="#1a1d2e"/>
    </linearGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff7a59"/>
      <stop offset="50%" stop-color="#ff3d3d"/>
      <stop offset="100%" stop-color="#a01030"/>
    </linearGradient>
    <linearGradient id="claw" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff5e3a"/>
      <stop offset="100%" stop-color="#9a0e2f"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#14F195" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#14F195" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M8 0H0V8" fill="none" stroke="#14F19518" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- backdrop -->
  <rect width="320" height="200" fill="url(#sea)"/>
  <rect width="320" height="200" fill="url(#grid)"/>
  <ellipse cx="160" cy="160" rx="120" ry="22" fill="url(#glow)" opacity="0.6">
    <animate attributeName="opacity" values="0.4;0.85;0.4" dur="3s" repeatCount="indefinite"/>
  </ellipse>

  <!-- bubbles -->
  <g fill="#9945FF" opacity="0.85">
    <circle cx="60" cy="180" r="3">
      <animate attributeName="cy" values="180;20" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="250" cy="180" r="2.5">
      <animate attributeName="cy" values="180;30" dur="5s" begin="-1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="5s" begin="-1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="120" cy="180" r="2" fill="#14F195">
      <animate attributeName="cy" values="180;10" dur="6s" begin="-2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="6s" begin="-2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="200" cy="180" r="2.2" fill="#14F195">
      <animate attributeName="cy" values="180;25" dur="4.5s" begin="-3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="4.5s" begin="-3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- the lobster: bobs up and down -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="2.4s" repeatCount="indefinite"/>

    <!-- antennae -->
    <g stroke="#ff3d3d" stroke-width="2" fill="none" stroke-linecap="round">
      <path d="M150 70 Q140 50 130 35">
        <animate attributeName="d" values="M150 70 Q140 50 130 35;M150 70 Q138 48 134 30;M150 70 Q140 50 130 35" dur="2s" repeatCount="indefinite"/>
      </path>
      <path d="M170 70 Q180 50 190 35">
        <animate attributeName="d" values="M170 70 Q180 50 190 35;M170 70 Q182 48 186 30;M170 70 Q180 50 190 35" dur="2s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- tail segments -->
    <g fill="url(#shell)" stroke="#5a0a18" stroke-width="1.5">
      <rect x="138" y="120" width="44" height="12" rx="4"/>
      <rect x="142" y="132" width="36" height="10" rx="4"/>
      <rect x="146" y="142" width="28" height="8" rx="3"/>
      <path d="M150 150 L160 162 L170 150 Z"/>
    </g>

    <!-- body -->
    <ellipse cx="160" cy="100" rx="34" ry="28" fill="url(#shell)" stroke="#5a0a18" stroke-width="1.5"/>
    <!-- shell shine -->
    <ellipse cx="148" cy="88" rx="10" ry="6" fill="#ffd0b8" opacity="0.7"/>

    <!-- legs -->
    <g stroke="#a01030" stroke-width="2.5" stroke-linecap="round">
      <line x1="138" y1="118" x2="125" y2="135"/>
      <line x1="148" y1="120" x2="138" y2="142"/>
      <line x1="172" y1="120" x2="182" y2="142"/>
      <line x1="182" y1="118" x2="195" y2="135"/>
    </g>

    <!-- left claw arm + claw (snipping) -->
    <g>
      <path d="M130 95 Q105 90 90 78" stroke="#a01030" stroke-width="6" fill="none" stroke-linecap="round"/>
      <g transform="translate(80 70)">
        <animateTransform attributeName="transform" type="rotate" values="-12 12 12;6 12 12;-12 12 12" dur="1.6s" repeatCount="indefinite"/>
        <path d="M0 12 Q-12 0 -2 -8 Q12 -10 22 0 Q26 14 12 22 Q0 26 -8 18 Q-12 16 -10 12 Z" fill="url(#claw)" stroke="#5a0a18" stroke-width="1.5" transform="translate(12 12)"/>
        <!-- pincer gap -->
        <path d="M14 8 Q20 12 14 18" stroke="#5a0a18" stroke-width="1.2" fill="none">
          <animate attributeName="d" values="M14 8 Q20 12 14 18;M16 6 Q26 12 16 20;M14 8 Q20 12 14 18" dur="1.6s" repeatCount="indefinite"/>
        </path>
      </g>
    </g>

    <!-- right claw arm + claw (snipping, opposite phase) -->
    <g>
      <path d="M190 95 Q215 90 230 78" stroke="#a01030" stroke-width="6" fill="none" stroke-linecap="round"/>
      <g transform="translate(216 70)">
        <animateTransform attributeName="transform" type="rotate" values="12 12 12;-6 12 12;12 12 12" dur="1.6s" begin="-0.8s" repeatCount="indefinite"/>
        <path d="M24 12 Q36 0 26 -8 Q12 -10 2 0 Q-2 14 12 22 Q24 26 32 18 Q36 16 34 12 Z" fill="url(#claw)" stroke="#5a0a18" stroke-width="1.5" transform="translate(0 12)"/>
        <path d="M10 8 Q4 12 10 18" stroke="#5a0a18" stroke-width="1.2" fill="none">
          <animate attributeName="d" values="M10 8 Q4 12 10 18;M8 6 Q-2 12 8 20;M10 8 Q4 12 10 18" dur="1.6s" begin="-0.8s" repeatCount="indefinite"/>
        </path>
      </g>
    </g>

    <!-- eyes -->
    <g>
      <circle cx="150" cy="92" r="4" fill="#0b1020"/>
      <circle cx="170" cy="92" r="4" fill="#0b1020"/>
      <circle cx="151" cy="91" r="1.4" fill="#14F195"/>
      <circle cx="171" cy="91" r="1.4" fill="#14F195"/>
      <!-- blink -->
      <rect x="146" y="89" width="8" height="0" fill="url(#shell)">
        <animate attributeName="height" values="0;0;5;0" keyTimes="0;0.85;0.92;1" dur="4s" repeatCount="indefinite"/>
      </rect>
      <rect x="166" y="89" width="8" height="0" fill="url(#shell)">
        <animate attributeName="height" values="0;0;5;0" keyTimes="0;0.85;0.92;1" dur="4s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- smile -->
    <path d="M154 104 Q160 109 166 104" stroke="#5a0a18" stroke-width="1.6" fill="none" stroke-linecap="round"/>

    <!-- $CLAWD chest tag -->
    <g transform="translate(146 108)">
      <rect width="28" height="9" rx="2" fill="#0b1020" stroke="#14F195" stroke-width="0.8"/>
      <text x="14" y="7" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="6" fill="#14F195" font-weight="700">$CLAWD</text>
    </g>
  </g>

  <!-- floor pixels -->
  <g fill="#9945FF" opacity="0.55">
    <rect x="20" y="186" width="6" height="3"/>
    <rect x="44" y="188" width="4" height="3"/>
    <rect x="80" y="186" width="5" height="3"/>
    <rect x="240" y="187" width="6" height="3"/>
    <rect x="270" y="186" width="4" height="3"/>
    <rect x="296" y="188" width="6" height="3"/>
  </g>
</svg>
